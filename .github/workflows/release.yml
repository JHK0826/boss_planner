# version.properties가 main에서 바뀌면 그 버전의 태그와 GitHub 릴리스를 만든다.
# 릴리스 노트는 CHANGELOG.md의 해당 버전 항목이다.
#
# 아래 비밀 값(Settings → Secrets and variables → Actions)이 등록되어 있으면 서명한 APK를 빌드해 릴리스에 붙인다.
#   GOOGLE_SERVICES_JSON  google-services.json 파일의 내용 전체
#   KEYSTORE_BASE64       서명 키 저장소 파일을 base64로 바꾼 글자
#   KEYSTORE_PASSWORD     키 저장소 비밀번호
#   KEY_ALIAS             (선택) 키 별칭. 없으면 bossplanner
#   KEY_PASSWORD          (선택) 키 비밀번호. 없으면 키 저장소 비밀번호와 같다고 본다
# 등록되어 있지 않으면 APK 없이 릴리스만 만든다.
name: Release

on:
  push:
    branches: [main]
    paths: [version.properties]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if gh release view "v$name" > /dev/null 2>&1; then
            echo "Release v$name already exists. Nothing to do."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes
        if: steps.version.outputs.exists != 'true'
        run: |
          if ! scripts/changelog-section.sh "${{ steps.version.outputs.name }}" > notes.md; then
            echo "::error::CHANGELOG.md에 ${{ steps.version.outputs.name }} 항목이 없습니다. 항목을 추가한 뒤 다시 올려 주세요."
            exit 1
          fi

      - name: Prepare signing
        id: signing
        if: steps.version.outputs.exists != 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ] || [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::notice::APK용 비밀 값이 등록되어 있지 않아 APK 없이 릴리스만 만듭니다."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build signed APK
        if: steps.signing.outputs.ready == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Create tag and release
        if: steps.version.outputs.exists != 'true'
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || true)
          gh release create "${{ steps.version.outputs.tag }}" $apk \
            --target "$GITHUB_SHA" --title "${{ steps.version.outputs.tag }}" --notes-file notes.md
